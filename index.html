<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GPA Calculator — Tabutility</title>
<meta name="description" content="Free GPA calculator. Add your courses, grades and credits to calculate your GPA instantly. Supports 4.0 and percentage scales."/>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-78VZWJ5B1W"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-78VZWJ5B1W');</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7039091592734005" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh}
nav{background:#1e293b;border-bottom:1px solid #334155;padding:14px 24px;display:flex;align-items:center;gap:16px}
nav a{color:#94a3b8;text-decoration:none;font-size:14px}nav a:hover{color:#f1f5f9}
nav .brand{color:#38bdf8;font-weight:700;font-size:18px}
.ad-banner{background:#1e293b;border-bottom:1px solid #334155;padding:8px;text-align:center}
#app{max-width:620px;margin:36px auto;padding:0 20px 40px}
h1{font-size:26px;font-weight:700;text-align:center;margin-bottom:6px}
.subtitle{text-align:center;color:#94a3b8;margin-bottom:24px;font-size:14px}
.result-bar{background:#1e293b;border-radius:16px;padding:20px 24px;border:1px solid #334155;margin-bottom:16px;display:flex;gap:32px;align-items:center;flex-wrap:wrap}
.gpa-big{font-family:monospace;font-size:64px;font-weight:800;color:#38bdf8;line-height:1}
.gpa-meta{display:flex;flex-direction:column;gap:6px}
.gpa-letter{font-size:22px;font-weight:700}
.gpa-sub{font-size:13px;color:#64748b}
.card{background:#1e293b;border-radius:16px;padding:20px;border:1px solid #334155;margin-bottom:14px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card-header h2{font-size:15px;font-weight:600}
.add-btn{background:#38bdf8;color:#0f172a;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer}
.course-row{display:grid;grid-template-columns:1fr 110px 80px 32px;gap:8px;margin-bottom:8px;align-items:center}
.course-row input,.course-row select{background:#0f172a;color:#f1f5f9;border:1px solid #334155;border-radius:8px;padding:8px;font-size:14px;width:100%}
.rm-btn{background:none;border:none;color:#475569;cursor:pointer;font-size:18px;padding:0;line-height:1}
.rm-btn:hover{color:#ef4444}
.col-headers{display:grid;grid-template-columns:1fr 110px 80px 32px;gap:8px;margin-bottom:6px}
.col-hdr{font-size:12px;color:#475569;font-weight:600}
.progress-wrap{height:8px;background:#334155;border-radius:4px;margin-top:8px;overflow:hidden}
.progress-bar{height:100%;border-radius:4px;transition:width .4s,background .4s}
.ref-card{background:#1e293b;border-radius:16px;border:1px solid #334155;overflow:hidden}
.ref-header{display:flex;padding:11px 16px;border-bottom:1px solid #334155;font-size:12px;color:#64748b;font-weight:600}
.ref-row{display:flex;padding:9px 16px;border-bottom:1px solid #0f172a;font-size:13px}
.ref-row:nth-child(even){background:#1a2535}
.ref-col{flex:1}
</style>
</head>
<body>
<nav><span class="brand">⚡ Tabutility</span><a href="https://tabutility.com">← All Tools</a></nav>
<div class="ad-banner"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-7039091592734005" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>
<div id="app">
  <h1>GPA Calculator</h1>
  <p class="subtitle">Add courses, grades and credits — your GPA updates instantly</p>

  <div class="result-bar" id="result-bar">
    <div class="gpa-big" id="gpa-val">—</div>
    <div class="gpa-meta">
      <div class="gpa-letter" id="gpa-letter" style="color:#38bdf8"></div>
      <div class="gpa-sub" id="gpa-sub">Add courses below</div>
    </div>
    <div style="flex:1;min-width:160px">
      <div class="progress-wrap"><div class="progress-bar" id="prog" style="width:0%;background:#38bdf8"></div></div>
      <div style="font-size:12px;color:#475569;margin-top:4px">out of 4.0</div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>Courses</h2>
      <button class="add-btn" onclick="addRow()">+ Add Course</button>
    </div>
    <div class="col-headers">
      <div class="col-hdr">Course Name</div>
      <div class="col-hdr">Grade</div>
      <div class="col-hdr">Credits</div>
      <div class="col-hdr"></div>
    </div>
    <div id="rows"></div>
  </div>

  <div class="ref-card">
    <div class="ref-header"><span class="ref-col">Letter</span><span class="ref-col">Percentage</span><span class="ref-col">GPA Points</span></div>
    <div id="ref-body"></div>
  </div>
</div>
<script>
var SCALE = [
  ['A+','97–100',4.0],['A','93–96',4.0],['A−','90–92',3.7],
  ['B+','87–89',3.3],['B','83–86',3.0],['B−','80–82',2.7],
  ['C+','77–79',2.3],['C','73–76',2.0],['C−','70–72',1.7],
  ['D+','67–69',1.3],['D','63–66',1.0],['D−','60–62',0.7],['F','0–59',0.0]
];

var refBody = document.getElementById('ref-body');
SCALE.forEach(function(s){
  var row=document.createElement('div'); row.className='ref-row';
  row.innerHTML='<span class="ref-col" style="font-weight:700">'+s[0]+'</span><span class="ref-col">'+s[1]+'%</span><span class="ref-col">'+s[2].toFixed(1)+'</span>';
  refBody.appendChild(row);
});

var courses = [];
var nextId = 1;

function addRow(name, grade, credits){
  var id = nextId++;
  courses.push({ id:id, name:name||'', grade:grade||'A', credits:credits||3 });
  renderRows();
}

function removeRow(id){
  courses = courses.filter(function(c){ return c.id!==id; });
  renderRows();
}

function renderRows(){
  var container = document.getElementById('rows');
  container.innerHTML='';
  courses.forEach(function(c){
    var row=document.createElement('div'); row.className='course-row';
    // Name input
    var ni=document.createElement('input'); ni.type='text'; ni.value=c.name; ni.placeholder='e.g. Math 101';
    ni.oninput=(function(id){ return function(e){ updateField(id,'name',e.target.value); }; })(c.id);
    // Grade select
    var gs=document.createElement('select');
    SCALE.forEach(function(s){
      var o=document.createElement('option'); o.value=s[2]; o.textContent=s[0];
      if(s[2]===c.grade) o.selected=true;
      gs.appendChild(o);
    });
    gs.value=c.grade;
    gs.onchange=(function(id){ return function(e){ updateField(id,'grade',parseFloat(e.target.value)); }; })(c.id);
    // Credits
    var cr=document.createElement('input'); cr.type='number'; cr.min='0.5'; cr.max='6'; cr.step='0.5'; cr.value=c.credits;
    cr.oninput=(function(id){ return function(e){ updateField(id,'credits',parseFloat(e.target.value)||0); }; })(c.id);
    // Remove
    var rm=document.createElement('button'); rm.className='rm-btn'; rm.textContent='✕';
    rm.onclick=(function(id){ return function(){ removeRow(id); }; })(c.id);
    row.appendChild(ni); row.appendChild(gs); row.appendChild(cr); row.appendChild(rm);
    container.appendChild(row);
  });
  calcGpa();
}

function updateField(id,field,val){
  courses=courses.map(function(c){ return c.id===id?Object.assign({},c,((function(o,k,v){o[k]=v;return o;})({},field,val))):c; });
  calcGpa();
}

function calcGpa(){
  var totalPoints=0, totalCredits=0;
  courses.forEach(function(c){ totalPoints+=c.grade*c.credits; totalCredits+=c.credits; });
  var gpaEl=document.getElementById('gpa-val');
  var letEl=document.getElementById('gpa-letter');
  var subEl=document.getElementById('gpa-sub');
  var prog=document.getElementById('prog');
  if(!totalCredits||!courses.length){ gpaEl.textContent='—'; letEl.textContent=''; subEl.textContent='Add courses below'; prog.style.width='0%'; return; }
  var gpa=totalPoints/totalCredits;
  gpaEl.textContent=gpa.toFixed(2);
  var letter=SCALE.find(function(s){ return gpa>=s[2]; });
  var lbl=letter?letter[0]:'F';
  letEl.textContent=lbl;
  var color = gpa>=3.7?'#22c55e':gpa>=3.0?'#38bdf8':gpa>=2.0?'#f59e0b':'#ef4444';
  gpaEl.style.color=color; letEl.style.color=color;
  prog.style.width=(gpa/4*100)+'%'; prog.style.background=color;
  subEl.textContent=totalCredits+' credit'+(totalCredits!==1?'s':'')+' · '+courses.length+' course'+(courses.length!==1?'s':'');
}

// Start with 4 default courses
addRow('Course 1','',3);
addRow('Course 2','',3);
addRow('Course 3','',3);
addRow('Course 4','',3);
</script>
</body>
</html>
